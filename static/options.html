<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elfi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="opts">
  <header>
    <h1 data-i18n="options"></h1>
    <div class="tools"><a href="index.html" data-i18n="back"></a></div>
  </header>
  <form class="options" onsubmit="return false">
    <label>
      <span data-i18n="language"></span>
      <select id="lang"><option value="nl">Nederlands</option><option value="en">English</option></select>
    </label>
    <label>
      <span data-i18n="range"></span>
      <select id="range">
        <option value="0-10">0 – 10</option>
        <option value="0-50">0 – 50</option>
        <option value="0-100">0 – 100</option>
        <option value="0-1000">0 – 1000</option>
        <option value="custom" data-i18n="custom"></option>
      </select>
    </label>
    <div id="custom" hidden>
      <label><span data-i18n="from"></span><input type="number" id="min" min="0" step="1"></label>
      <label><span data-i18n="to"></span><input type="number" id="max" min="0" step="1"></label>
    </div>
    <label>
      <span data-i18n="mode"></span>
      <input type="checkbox" id="mode" role="switch">
    </label>
    <label>
      <span data-i18n="scratch"></span>
      <input type="checkbox" id="scratch" role="switch">
    </label>
    <fieldset>
      <legend data-i18n="operations"></legend>
      <label><input type="checkbox" class="op" id="op-0">+</label>
      <label><input type="checkbox" class="op" id="op-1">−</label>
      <label><input type="checkbox" class="op" id="op-2">×</label>
      <label><input type="checkbox" class="op" id="op-3">:</label>
    </fieldset>
    <label>
      <span data-i18n="maxChildren"></span>
      <input type="number" id="children" min="2" max="5" step="1">
    </label>
    <label>
      <span data-i18n="maxNodes"></span>
      <input type="number" id="nodes" min="10" max="100" step="1">
    </label>
    <label>
      <span data-i18n="movie"></span>
      <input type="checkbox" id="movie" role="switch">
    </label>
    <p id="error" role="alert"></p>
  </form>
  <script type="module" src="/dist/options.js"></script>
</body>
</html>
